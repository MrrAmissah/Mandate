openapi: 3.1.0
info:
  title: Mandate-API Execution Lifecycle
  version: 0.6.0-phase3b
  description: Contract for single-use decision reservations, attempt completion/cancellation, and attempt-bound receipts.
servers:
  - url: http://localhost:8787
security:
  - ApiKey: []
paths:
  /v1/action-attempts:
    post:
      operationId: reserveActionAttempt
      summary: Reserve an ALLOW decision for one execution
      x-required-scope: action_attempts:write
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveActionAttemptRequest' }
      responses:
        '201': { $ref: '#/components/responses/ActionAttemptResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
    get:
      operationId: listActionAttempts
      summary: List tenant-visible action attempts
      x-required-scope: action_attempts:read
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
      responses:
        '200':
          description: Action-attempt page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionAttemptListResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /v1/action-attempts/{id}:
    get:
      operationId: getActionAttempt
      summary: Retrieve an action attempt
      x-required-scope: action_attempts:read
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActionAttemptId'
      responses:
        '200': { $ref: '#/components/responses/ActionAttemptResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/action-attempts/{id}/complete:
    post:
      operationId: completeActionAttempt
      summary: Store terminal execution evidence
      x-required-scope: action_attempts:write
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActionAttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteActionAttemptRequest' }
      responses:
        '200': { $ref: '#/components/responses/ActionAttemptResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /v1/action-attempts/{id}/cancel:
    post:
      operationId: cancelActionAttempt
      summary: Cancel an unexpired reservation
      x-required-scope: action_attempts:write
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActionAttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelActionAttemptRequest' }
      responses:
        '200': { $ref: '#/components/responses/ActionAttemptResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /v1/receipts:
    post:
      operationId: issueAttemptReceipt
      summary: Sign the evidence stored by a completed action attempt
      x-required-scope: receipts:write
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueAttemptReceiptRequest' }
      responses:
        '201':
          description: Signed action receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptReceipt' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    ActionAttemptId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^att_.+' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StartingAfter:
      name: startingAfter
      in: query
      required: false
      schema: { type: string }
  responses:
    ActionAttemptResponse:
      description: Action attempt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ActionAttempt' }
    ErrorResponse:
      description: Request failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ReserveActionAttemptRequest:
      type: object
      additionalProperties: false
      required: [decisionId]
      properties:
        decisionId: { type: string, pattern: '^dec_.+' }
        expiresInSeconds: { type: integer, minimum: 30, maximum: 900, default: 300 }
    CompleteActionAttemptRequest:
      type: object
      additionalProperties: false
      required: [executionStatus, inputHash, outputHash, tool]
      properties:
        executionStatus: { type: string, enum: [SUCCEEDED, FAILED, PARTIAL] }
        inputHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        outputHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        tool: { type: string, minLength: 1 }
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
    CancelActionAttemptRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    IssueAttemptReceiptRequest:
      type: object
      additionalProperties: false
      required: [actionAttemptId]
      properties:
        actionAttemptId: { type: string, pattern: '^att_.+' }
    ActionAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - decisionId
        - mandateId
        - agentId
        - action
        - resource
        - status
        - reservedByCredentialId
        - reservedAt
        - expiresAt
        - requestId
        - executionStatus
        - inputHash
        - outputHash
        - tool
        - provider
        - model
        - completedAt
        - completionRequestId
        - terminatedAt
        - terminationReason
        - terminationRequestId
        - version
      properties:
        id: { type: string, pattern: '^att_.+' }
        decisionId: { type: string, pattern: '^dec_.+' }
        mandateId: { type: string, pattern: '^mnd_.+' }
        agentId: { type: string }
        action: { type: string }
        resource: { type: string }
        status: { type: string, enum: [RESERVED, COMPLETED, CANCELLED, EXPIRED] }
        reservedByCredentialId: { type: string, pattern: '^key_.+' }
        reservedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        requestId: { type: string }
        executionStatus: { type: [string, 'null'], enum: [SUCCEEDED, FAILED, PARTIAL, null] }
        inputHash: { type: [string, 'null'] }
        outputHash: { type: [string, 'null'] }
        tool: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
        completionRequestId: { type: [string, 'null'] }
        terminatedAt: { type: [string, 'null'], format: date-time }
        terminationReason: { type: [string, 'null'] }
        terminationRequestId: { type: [string, 'null'] }
        version: { type: integer, minimum: 0 }
    AttemptReceipt:
      type: object
      additionalProperties: true
      required:
        - id
        - version
        - keyId
        - algorithm
        - decisionId
        - mandateId
        - actionAttemptId
        - principalId
        - agentId
        - action
        - resource
        - executionStatus
        - inputHash
        - outputHash
        - tool
        - authorizedAt
        - executedAt
        - issuedAt
        - signature
      properties:
        id: { type: string, pattern: '^rcpt_.+' }
        version: { type: string, const: '1.1' }
        keyId: { type: string }
        algorithm: { type: string, const: Ed25519 }
        decisionId: { type: string, pattern: '^dec_.+' }
        mandateId: { type: string, pattern: '^mnd_.+' }
        actionAttemptId: { type: string, pattern: '^att_.+' }
        principalId: { type: string }
        agentId: { type: string }
        action: { type: string }
        resource: { type: string }
        executionStatus: { type: string, enum: [SUCCEEDED, FAILED, PARTIAL] }
        inputHash: { type: string }
        outputHash: { type: string }
        tool: { type: string }
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        approvalId: { type: [string, 'null'] }
        authorizedAt: { type: [string, 'null'], format: date-time }
        executedAt: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time }
        signature: { type: string }
    ActionAttemptListResponse:
      type: object
      additionalProperties: false
      required: [data, hasMore, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ActionAttempt' }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: [object, 'null'], additionalProperties: true }
            requestId: { type: string }
