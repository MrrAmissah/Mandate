name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: mandate
          POSTGRES_PASSWORD: mandate
          POSTGRES_DB: mandate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandate -d mandate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Apply PostgreSQL migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://mandate:mandate@127.0.0.1:5432/mandate
      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://mandate:mandate@127.0.0.1:5432/mandate
      - name: Build production image
        run: docker build --pull --tag mandate:ci .
      - name: Verify production image posture
        run: |
          test "$(docker image inspect mandate:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint node mandate:ci --version | grep -Fx 'v22.23.1'
      - name: Validate production Compose topology
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          printf '%s' 'postgresql://fixture' > "$fixture_dir/database-url"
          printf '%s' 'fixture-api-key' > "$fixture_dir/api-key"
          printf '%s' 'fixture-private-key' > "$fixture_dir/private-key"
          printf '%s' 'fixture-public-key' > "$fixture_dir/public-key"
          printf '%s\n' 'export default {};' > "$fixture_dir/outbox-handlers.js"
          MANDATE_IMAGE=mandate:ci \
          MANDATE_TENANT_ID=ten_ci \
          MANDATE_TENANT_NAME='CI tenant' \
          MANDATE_API_CREDENTIAL_ID=key_ci \
          MANDATE_API_SCOPES=mandates:read,mandates:write \
          MANDATE_KEY_ID=key_ci_ed25519 \
          MANDATE_EXPIRY_WORKER_ID=expiry-ci-01 \
          MANDATE_APPROVAL_EXPIRY_WORKER_ID=approval-expiry-ci-01 \
          MANDATE_OUTBOX_WORKER_ID=outbox-ci-01 \
          MANDATE_OUTBOX_HANDLER_FILE="$fixture_dir/outbox-handlers.js" \
          MANDATE_MIGRATION_DATABASE_URL_FILE="$fixture_dir/database-url" \
          MANDATE_API_DATABASE_URL_FILE="$fixture_dir/database-url" \
          MANDATE_EXPIRY_DATABASE_URL_FILE="$fixture_dir/database-url" \
          MANDATE_APPROVAL_EXPIRY_DATABASE_URL_FILE="$fixture_dir/database-url" \
          MANDATE_OUTBOX_DATABASE_URL_FILE="$fixture_dir/database-url" \
          MANDATE_API_KEY_SECRET_FILE="$fixture_dir/api-key" \
          MANDATE_PRIVATE_KEY_SECRET_FILE="$fixture_dir/private-key" \
          MANDATE_PUBLIC_KEY_SECRET_FILE="$fixture_dir/public-key" \
          docker compose -f deployment/compose.production.yaml config --quiet
