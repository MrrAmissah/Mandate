openapi: 3.1.0
info:
  title: Mandate-API
  version: 0.10.0
  summary: Delegated authorization, assigned human approvals, database-time approval expiry, authority-scoped approval inboxes, single-use execution attempts, and append-only signed receipts for AI agents
  description: |
    Mandate-API is a provider-independent trust layer for consequential agent actions.
    Sensitive actions can require an approval assigned to a durable approver identity or an
    eligibility-snapshotted approver group. The approval inbox derives visibility from the
    authenticated credential's active approver identity, current assignment, and immutable
    assignment-time eligibility snapshot. Approval deadlines are enforced by PostgreSQL time:
    overdue PENDING or APPROVED-but-unconsumed approvals converge to durable EXPIRED state and
    cannot be decided, reassigned, cancelled, or consumed after the deadline. An ALLOW decision
    must be reserved by one ActionAttempt and completed with execution evidence before one root
    Receipt is signed. Corrections append a linear signed successor chain; they never rewrite the
    original receipt or its execution evidence.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8787
    description: Local development
tags:
  - name: System
  - name: Mandates
  - name: Approvals
  - name: Approval inbox
  - name: Approver administration
  - name: Authorizations
  - name: Action attempts
  - name: Receipts
security:
  - ApiKey: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check service health
      security: []
      responses:
        '200':
          description: Service is accepting requests
          content:
            application/json:
              schema:
                type: object
                required: [status, service, requestId]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: mandate-api }
                  requestId: { type: string }
  /.well-known/mandate-keys:
    get:
      tags: [System]
      operationId: listVerificationKeys
      summary: List active and retired public receipt-verification keys
      security: []
      responses:
        '200':
          description: Discoverable Ed25519 verification keys; revoked keys are excluded
          headers:
            Cache-Control:
              schema: { type: string, const: 'public, max-age=300' }
          content:
            application/json:
              schema:
                type: object
                required: [keys, requestId]
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/VerificationKey' }
                  requestId: { type: string }
  /v1/mandates:
    post:
      tags: [Mandates]
      operationId: createMandate
      summary: Create an active delegated mandate
      x-required-scope: mandates:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMandateRequest' }
      responses:
        '201': { $ref: '#/components/responses/MandateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Mandates]
      operationId: listMandates
      summary: List tenant-visible mandates
      x-required-scope: mandates:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/StartingAfter' }
      responses:
        '200':
          description: Mandate page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MandateListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/mandates/{id}:
    get:
      tags: [Mandates]
      operationId: getMandate
      summary: Retrieve a tenant-visible mandate
      x-required-scope: mandates:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/MandateId' }
      responses:
        '200': { $ref: '#/components/responses/MandateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/mandates/{id}/revoke:
    post:
      tags: [Mandates]
      operationId: revokeMandate
      summary: Revoke a mandate
      x-required-scope: mandates:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/MandateId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/MandateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/approver-identities:
    post:
      tags: [Approver administration]
      operationId: createApproverIdentity
      summary: Create a durable approver identity and optionally bind a credential
      x-required-scope: approvers:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApproverIdentityRequest' }
      responses:
        '201': { $ref: '#/components/responses/ApproverIdentityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Approver administration]
      operationId: listApproverIdentities
      summary: List tenant-visible approver identities
      x-required-scope: approvers:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '200':
          description: Approver identities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApproverIdentityListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/approver-identities/{id}/disable:
    post:
      tags: [Approver administration]
      operationId: disableApproverIdentity
      summary: Disable an approver identity
      description: Disabling an identity immediately removes its live decision authority, including existing assignment snapshots.
      x-required-scope: approvers:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ApproverIdentityId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/ApproverIdentityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/approver-identities/{id}/bindings:
    post:
      tags: [Approver administration]
      operationId: bindApproverCredential
      summary: Bind an active API credential to an approver identity
      x-required-scope: approvers:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ApproverIdentityId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindApproverCredentialRequest' }
      responses:
        '201': { $ref: '#/components/responses/ApproverCredentialBindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/approver-identities/{id}/bindings/revoke:
    post:
      tags: [Approver administration]
      operationId: revokeApproverCredentialBinding
      summary: Revoke one active credential-to-approver binding
      x-required-scope: approvers:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ApproverIdentityId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credentialId, reason]
              properties:
                credentialId: { type: string, pattern: '^key_.+' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/ApproverCredentialBindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/approver-groups:
    post:
      tags: [Approver administration]
      operationId: createApproverGroup
      summary: Create an approver group
      x-required-scope: approvers:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201': { $ref: '#/components/responses/ApproverGroupResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Approver administration]
      operationId: listApproverGroups
      summary: List tenant-visible approver groups
      x-required-scope: approvers:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '200':
          description: Approver groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApproverGroupListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/approver-groups/{id}/members:
    post:
      tags: [Approver administration]
      operationId: addApproverGroupMember
      summary: Add one active approver identity to a group
      description: Existing approval assignments are not expanded; group eligibility is snapshotted only when an assignment is created.
      x-required-scope: approvers:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ApproverGroupId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approverId]
              properties:
                approverId: { type: string, pattern: '^apv_.+' }
      responses:
        '201': { $ref: '#/components/responses/ApproverGroupMembershipResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/approver-groups/{id}/members/{approverId}/remove:
    post:
      tags: [Approver administration]
      operationId: removeApproverGroupMember
      summary: Remove an approver from future group assignment snapshots
      description: Existing assignment snapshots remain unchanged; disable the approver identity when immediate removal of live decision authority is required.
      x-required-scope: approvers:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ApproverGroupId' }
        - { $ref: '#/components/parameters/ApproverMemberId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/ApproverGroupMembershipResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/approvals:
    post:
      tags: [Approvals]
      operationId: createApproval
      summary: Request exact human approval with an explicit assignment
      description: Group assignments snapshot the currently active members; later membership additions do not expand a pending approval's eligibility.
      x-required-scope: approvals:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApprovalRequest' }
      responses:
        '201': { $ref: '#/components/responses/AssignedApprovalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List tenant-visible approvals
      x-required-scope: approvals:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/StartingAfter' }
      responses:
        '200':
          description: Approval page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/approvals/{id}:
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Retrieve an approval
      x-required-scope: approvals:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/ApprovalId' }
      responses:
        '200': { $ref: '#/components/responses/ApprovalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/approvals/{id}/assignment:
    get:
      tags: [Approvals]
      operationId: getApprovalAssignment
      summary: Retrieve the active assignment and its immutable eligibility snapshot
      x-required-scope: approvals:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/ApprovalId' }
      responses:
        '200': { $ref: '#/components/responses/ApprovalAssignmentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/approvals/{id}/decide:
    post:
      tags: [Approvals]
      operationId: decideApproval
      summary: Approve or reject a pending request as the authenticated eligible approver
      description: The deciding approver identity is derived from the authenticated credential. Callers must not supply decidedBy. PostgreSQL time rejects a decision that reaches commit after expiresAt with APPROVAL_EXPIRED.
      x-required-scope: approvals:decide
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ApprovalId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/ApprovalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/approvals/{id}/reassign:
    post:
      tags: [Approvals]
      operationId: reassignApproval
      summary: Supersede a pending approval assignment with a new explicit snapshot
      description: PostgreSQL time rejects reassignment after expiresAt with APPROVAL_EXPIRED.
      x-required-scope: approvals:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ApprovalId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignment]
              properties:
                assignment: { $ref: '#/components/schemas/ApprovalAssignmentSelector' }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/ReassignmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/approvals/{id}/cancel:
    post:
      tags: [Approvals]
      operationId: cancelApproval
      summary: Cancel a pending approval and its active assignment
      description: PostgreSQL time rejects cancellation after expiresAt with APPROVAL_EXPIRED.
      x-required-scope: approvals:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ApprovalId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/ApprovalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/approval-inbox:
    get:
      tags: [Approval inbox]
      operationId: listApprovalInbox
      summary: List approvals currently visible to the authenticated approver
      description: |
        This is not an administrative approval list. Visibility is derived from the authenticated
        credential's active approver identity, the current active assignment, and that assignment's
        immutable eligibility snapshot. ACTIONABLE is the default and excludes overdue approvals.
        PENDING also returns overdue approvals that have not yet been materialized into terminal
        EXPIRED state; those items have actionable=false and overdue=true.
      x-required-scope: approval_inbox:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/StartingAfter' }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [ACTIONABLE, PENDING], default: ACTIONABLE }
      responses:
        '200':
          description: Authority-scoped approval inbox page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalInboxListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/approval-inbox/{id}:
    get:
      tags: [Approval inbox]
      operationId: getApprovalInboxItem
      summary: Retrieve one currently visible pending approval inbox item
      description: |
        Returns 404 when the approval is not pending, has no current active assignment, or the
        authenticated approver is not in the immutable eligibility snapshot. Overdue pending
        approvals remain inspectable but are never marked actionable until the expiry worker
        materializes EXPIRED state.
      x-required-scope: approval_inbox:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/ApprovalId' }
      responses:
        '200': { $ref: '#/components/responses/ApprovalInboxItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/authorize:
    post:
      tags: [Authorizations]
      operationId: authorizeAction
      summary: Evaluate a proposed agent action
      description: Produces ALLOW, DENY, or REQUIRE_APPROVAL. An APPROVED approval cannot be consumed after expiresAt; PostgreSQL time returns APPROVAL_EXPIRED on a deadline race.
      x-required-scope: authorizations:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationRequest' }
      responses:
        '200': { $ref: '#/components/responses/DecisionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/decisions:
    get:
      tags: [Authorizations]
      operationId: listDecisions
      summary: List immutable authorization decisions
      x-required-scope: authorizations:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/StartingAfter' }
      responses:
        '200':
          description: Decision page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/decisions/{id}:
    get:
      tags: [Authorizations]
      operationId: getDecision
      summary: Retrieve an immutable decision
      x-required-scope: authorizations:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/DecisionId' }
      responses:
        '200': { $ref: '#/components/responses/DecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/action-attempts:
    post:
      tags: [Action attempts]
      operationId: reserveActionAttempt
      summary: Reserve an ALLOW decision for one execution
      x-required-scope: action_attempts:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveActionAttemptRequest' }
      responses:
        '201': { $ref: '#/components/responses/ActionAttemptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Action attempts]
      operationId: listActionAttempts
      summary: List tenant-visible action attempts
      x-required-scope: action_attempts:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/StartingAfter' }
      responses:
        '200':
          description: Action-attempt page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionAttemptListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/action-attempts/{id}:
    get:
      tags: [Action attempts]
      operationId: getActionAttempt
      summary: Retrieve an action attempt
      x-required-scope: action_attempts:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/ActionAttemptId' }
      responses:
        '200': { $ref: '#/components/responses/ActionAttemptResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/action-attempts/{id}/complete:
    post:
      tags: [Action attempts]
      operationId: completeActionAttempt
      summary: Store terminal execution evidence
      description: Only the credential that reserved the attempt may complete it.
      x-required-scope: action_attempts:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ActionAttemptId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteActionAttemptRequest' }
      responses:
        '200': { $ref: '#/components/responses/ActionAttemptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/action-attempts/{id}/cancel:
    post:
      tags: [Action attempts]
      operationId: cancelActionAttempt
      summary: Cancel an unexpired reservation
      description: Only the credential that reserved the attempt may cancel it.
      x-required-scope: action_attempts:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ActionAttemptId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelActionAttemptRequest' }
      responses:
        '200': { $ref: '#/components/responses/ActionAttemptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/receipts:
    post:
      tags: [Receipts]
      operationId: issueAttemptReceipt
      summary: Sign evidence from a completed action attempt
      description: Fails closed when the configured signer is not the active scoped signing key.
      x-required-scope: receipts:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueAttemptReceiptRequest' }
      responses:
        '201': { $ref: '#/components/responses/ReceiptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [Receipts]
      operationId: listReceipts
      summary: List signed receipts
      x-required-scope: receipts:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/StartingAfter' }
      responses:
        '200':
          description: Receipt page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/receipts/{id}:
    get:
      tags: [Receipts]
      operationId: getReceipt
      summary: Retrieve a signed receipt
      x-required-scope: receipts:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/ReceiptId' }
      responses:
        '200': { $ref: '#/components/responses/ReceiptResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/receipts/{id}/supersede:
    post:
      tags: [Receipts]
      operationId: supersedeReceipt
      summary: Append a signed successor to an execution receipt
      description: |
        Creates one direct successor that preserves the predecessor's execution evidence.
        The predecessor must verify through an active or retired scoped key. The configured
        successor signer must be the current active scoped key. A predecessor may have at most
        one successor, producing a linear append-only chain.
      x-required-scope: receipts:write
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ReceiptId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupersedeReceiptRequest' }
      responses:
        '201': { $ref: '#/components/responses/ReceiptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/receipts/verify:
    post:
      tags: [Receipts]
      operationId: verifyReceipt
      summary: Verify a receipt through its registered active or retired key
      x-required-scope: receipts:read
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receipt]
              properties:
                receipt: { $ref: '#/components/schemas/Receipt' }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [valid, keyId, algorithm]
                properties:
                  valid: { type: boolean }
                  keyId: { type: [string, 'null'] }
                  algorithm: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
  headers:
    RequestId:
      description: Request correlation identifier
      schema: { type: string }
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StartingAfter:
      name: startingAfter
      in: query
      required: false
      schema: { type: string }
    MandateId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^mnd_.+' }
    ApprovalId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^apr_.+' }
    ApproverIdentityId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^apv_.+' }
    ApproverGroupId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^apg_.+' }
    ApproverMemberId:
      name: approverId
      in: path
      required: true
      schema: { type: string, pattern: '^apv_.+' }
    DecisionId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^dec_.+' }
    ActionAttemptId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^att_.+' }
    ReceiptId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^rcpt_.+' }
  responses:
    MandateResponse:
      description: Mandate
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Mandate' }
    ApprovalResponse:
      description: Approval
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Approval' }
    AssignedApprovalResponse:
      description: Newly requested approval and active assignment snapshot
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignedApproval' }
    ApprovalAssignmentResponse:
      description: Active approval assignment
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApprovalAssignment' }
    ReassignmentResponse:
      description: Approval reassignment result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReassignmentResult' }
    ApprovalInboxItemResponse:
      description: Approval currently visible to the authenticated approver
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApprovalInboxItem' }
    ApproverIdentityResponse:
      description: Approver identity
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApproverIdentity' }
    ApproverCredentialBindingResponse:
      description: Approver credential binding
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApproverCredentialBinding' }
    ApproverGroupResponse:
      description: Approver group
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApproverGroup' }
    ApproverGroupMembershipResponse:
      description: Approver group membership result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApproverGroupMembership' }
    DecisionResponse:
      description: Authorization decision
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthorizationDecision' }
    ActionAttemptResponse:
      description: Action attempt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ActionAttempt' }
    ReceiptResponse:
      description: Signed receipt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid API credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Missing scope, action-attempt owner mismatch, authenticated approver is not eligible for the assignment, or the credential is not bound to an active approver identity
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Tenant-visible or current-authority-visible resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: State, idempotency, assignment, deadline (including APPROVAL_EXPIRED), or concurrency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Receipt signing is unavailable; code SIGNING_KEY_NOT_ACTIVE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    VerificationKey:
      type: object
      additionalProperties: false
      required: [keyId, algorithm, publicKeyPem, fingerprint, status, activatedAt, retiredAt]
      properties:
        keyId: { type: string }
        algorithm: { type: string, const: Ed25519 }
        publicKeyPem: { type: string }
        fingerprint: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        activatedAt: { type: [string, 'null'], format: date-time }
        retiredAt: { type: [string, 'null'], format: date-time }
    CreateMandateRequest:
      type: object
      additionalProperties: false
      required: [principalId, agentId, purpose, resources, allowedActions]
      properties:
        principalId: { type: string, minLength: 1 }
        agentId: { type: string, minLength: 1 }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        resources: { type: array, minItems: 1, items: { type: string } }
        allowedActions: { type: array, minItems: 1, items: { type: string } }
        deniedActions: { type: array, items: { type: string }, default: [] }
        approvalRequiredActions: { type: array, items: { type: string }, default: [] }
        constraints: { type: object, additionalProperties: true, default: {} }
        validFrom: { type: string, format: date-time }
        validUntil: { type: [string, 'null'], format: date-time }
        maxUses: { type: [integer, 'null'], minimum: 1 }
    Mandate:
      allOf:
        - { $ref: '#/components/schemas/CreateMandateRequest' }
        - type: object
          required: [id, status, uses, createdAt, revokedAt, revocationReason]
          properties:
            id: { type: string, pattern: '^mnd_.+' }
            status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
            uses: { type: integer, minimum: 0 }
            createdAt: { type: string, format: date-time }
            revokedAt: { type: [string, 'null'], format: date-time }
            revocationReason: { type: [string, 'null'] }
    ApprovalAssignmentSelector:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [APPROVER, GROUP] }
        id:
          type: string
          description: apv_ approver ID for APPROVER or apg_ group ID for GROUP
    CreateApprovalRequest:
      type: object
      additionalProperties: false
      required: [mandateId, agentId, action, resource, summary, assignment]
      properties:
        mandateId: { type: string, pattern: '^mnd_.+' }
        agentId: { type: string }
        action: { type: string }
        resource: { type: string }
        summary: { type: string, minLength: 1 }
        expiresAt: { type: [string, 'null'], format: date-time }
        assignment: { $ref: '#/components/schemas/ApprovalAssignmentSelector' }
    Approval:
      type: object
      additionalProperties: true
      required: [id, mandateId, agentId, action, resource, summary, status, requestedAt, decidedAt, decidedBy, decisionReason, consumedAt, consumedByDecisionId]
      properties:
        id: { type: string, pattern: '^apr_.+' }
        mandateId: { type: string, pattern: '^mnd_.+' }
        agentId: { type: string }
        action: { type: string }
        resource: { type: string }
        summary: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED, CANCELLED, CONSUMED] }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy:
          type: [string, 'null']
          description: Compatibility projection; new decisions contain the server-derived approver identity ID.
        decidedByApproverId: { type: [string, 'null'], pattern: '^apv_.+' }
        decisionReason: { type: [string, 'null'] }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelledByCredentialId: { type: [string, 'null'], pattern: '^key_.+' }
        cancellationReason: { type: [string, 'null'] }
        expiredAt: { type: [string, 'null'], format: date-time }
        expirationReason:
          type: [string, 'null']
          description: DEADLINE_ELAPSED for durable worker-materialized expiry.
        expirationRequestId:
          type: [string, 'null']
          description: System request identifier that ties expiry state to immutable audit/outbox evidence.
        consumedAt: { type: [string, 'null'], format: date-time }
        consumedByDecisionId: { type: [string, 'null'] }
    ApprovalAssignment:
      type: object
      additionalProperties: false
      required: [id, approvalId, sourceType, sourceId, status, assignedByCredentialId, assignedAt, endedAt, endReason, version, eligibleApproverIds]
      properties:
        id: { type: string, pattern: '^apa_.+' }
        approvalId: { type: string, pattern: '^apr_.+' }
        sourceType: { type: string, enum: [APPROVER, GROUP] }
        sourceId: { type: string }
        status: { type: string, enum: [ACTIVE, SUPERSEDED, CANCELLED, EXPIRED] }
        assignedByCredentialId: { type: string, pattern: '^key_.+' }
        assignedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        endReason: { type: [string, 'null'] }
        version: { type: integer, minimum: 0 }
        eligibleApproverIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^apv_.+' }
    AssignedApproval:
      allOf:
        - { $ref: '#/components/schemas/Approval' }
        - type: object
          required: [assignment]
          properties:
            assignment: { $ref: '#/components/schemas/ApprovalAssignment' }
    ReassignmentResult:
      type: object
      additionalProperties: false
      required: [approvalId, previousAssignmentId, assignment]
      properties:
        approvalId: { type: string, pattern: '^apr_.+' }
        previousAssignmentId: { type: string, pattern: '^apa_.+' }
        assignment: { $ref: '#/components/schemas/ApprovalAssignment' }
    CreateApproverIdentityRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        bindCurrentCredential: { type: boolean }
        credentialId: { type: string, pattern: '^key_.+' }
      not:
        required: [bindCurrentCredential, credentialId]
    BindApproverCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        bindCurrentCredential: { type: boolean, const: true }
        credentialId: { type: string, pattern: '^key_.+' }
      oneOf:
        - required: [bindCurrentCredential]
        - required: [credentialId]
    ApproverCredentialBinding:
      type: object
      additionalProperties: false
      required: [id, approverId, credentialId, status, boundAt, revokedAt, revocationReason]
      properties:
        id: { type: string, pattern: '^apb_.+' }
        approverId: { type: string, pattern: '^apv_.+' }
        credentialId: { type: string, pattern: '^key_.+' }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        boundAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        revocationReason: { type: [string, 'null'] }
    ApproverIdentity:
      type: object
      additionalProperties: false
      required: [id, displayName, status, createdAt, disabledAt, disableReason]
      properties:
        id: { type: string, pattern: '^apv_.+' }
        displayName: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: [string, 'null'], format: date-time }
        disableReason: { type: [string, 'null'] }
        binding:
          oneOf:
            - { $ref: '#/components/schemas/ApproverCredentialBinding' }
            - { type: 'null' }
    ApproverGroup:
      type: object
      additionalProperties: false
      required: [id, name, status, createdAt, disabledAt, disableReason]
      properties:
        id: { type: string, pattern: '^apg_.+' }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: [string, 'null'], format: date-time }
        disableReason: { type: [string, 'null'] }
    ApproverGroupMembership:
      type: object
      additionalProperties: false
      required: [groupId, approverId, status]
      properties:
        id: { type: string, pattern: '^agm_.+' }
        groupId: { type: string, pattern: '^apg_.+' }
        approverId: { type: string, pattern: '^apv_.+' }
        status: { type: string, enum: [ACTIVE, REMOVED] }
        addedAt: { type: string, format: date-time }
        removedAt: { type: [string, 'null'], format: date-time }
        removalReason: { type: [string, 'null'] }
    ApproverIdentityListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ApproverIdentity' } }
    ApproverGroupListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ApproverGroup' } }
    ApprovalInboxAssignment:
      type: object
      additionalProperties: false
      required: [id, sourceType, sourceId, assignedAt]
      properties:
        id: { type: string, pattern: '^apa_.+' }
        sourceType: { type: string, enum: [APPROVER, GROUP] }
        sourceId: { type: string }
        assignedAt: { type: string, format: date-time }
    ApprovalInboxApprover:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, pattern: '^apv_.+' }
        displayName: { type: string }
    ApprovalInboxItem:
      type: object
      additionalProperties: false
      required: [id, mandateId, agentId, action, resource, summary, status, requestedAt, expiresAt, actionable, overdue, assignment, approver]
      properties:
        id: { type: string, pattern: '^apr_.+' }
        mandateId: { type: string, pattern: '^mnd_.+' }
        agentId: { type: string }
        action: { type: string }
        resource: { type: string }
        summary: { type: string }
        status: { type: string, const: PENDING }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        actionable: { type: boolean }
        overdue: { type: boolean }
        assignment: { $ref: '#/components/schemas/ApprovalInboxAssignment' }
        approver: { $ref: '#/components/schemas/ApprovalInboxApprover' }
    ApprovalInboxListResponse:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          required: [state]
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/ApprovalInboxItem' } }
            state: { type: string, enum: [ACTIONABLE, PENDING] }
    AuthorizationRequest:
      type: object
      additionalProperties: false
      required: [mandateId, agentId, action, resource]
      properties:
        mandateId: { type: string, pattern: '^mnd_.+' }
        agentId: { type: string }
        action: { type: string }
        resource: { type: string }
        context: { type: object, additionalProperties: true, default: {} }
        approvalId: { type: [string, 'null'], pattern: '^apr_.+' }
    AuthorizationDecision:
      type: object
      additionalProperties: false
      required: [id, mandateId, agentId, action, resource, context, outcome, reasonCode, reason, approvalId, evaluatedAt, requestId]
      properties:
        id: { type: string, pattern: '^dec_.+' }
        mandateId: { type: string, pattern: '^mnd_.+' }
        agentId: { type: string }
        action: { type: string }
        resource: { type: string }
        context: { type: object, additionalProperties: true }
        outcome: { type: string, enum: [ALLOW, DENY, REQUIRE_APPROVAL] }
        reasonCode: { type: string }
        reason: { type: string }
        approvalId: { type: [string, 'null'] }
        evaluatedAt: { type: string, format: date-time }
        requestId: { type: string }
    ReserveActionAttemptRequest:
      type: object
      additionalProperties: false
      required: [decisionId]
      properties:
        decisionId: { type: string, pattern: '^dec_.+' }
        expiresInSeconds: { type: integer, minimum: 30, maximum: 900, default: 300 }
    CompleteActionAttemptRequest:
      type: object
      additionalProperties: false
      required: [executionStatus, inputHash, outputHash, tool]
      properties:
        executionStatus: { type: string, enum: [SUCCEEDED, FAILED, PARTIAL] }
        inputHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        outputHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        tool: { type: string, minLength: 1 }
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
    CancelActionAttemptRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    ActionAttempt:
      type: object
      additionalProperties: false
      required: [id, decisionId, mandateId, agentId, action, resource, status, reservedByCredentialId, reservedAt, expiresAt, requestId, executionStatus, inputHash, outputHash, tool, provider, model, completedAt, completionRequestId, terminatedAt, terminationReason, terminationRequestId, version]
      properties:
        id: { type: string, pattern: '^att_.+' }
        decisionId: { type: string, pattern: '^dec_.+' }
        mandateId: { type: string, pattern: '^mnd_.+' }
        agentId: { type: string }
        action: { type: string }
        resource: { type: string }
        status: { type: string, enum: [RESERVED, COMPLETED, CANCELLED, EXPIRED] }
        reservedByCredentialId: { type: string, pattern: '^key_.+' }
        reservedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        requestId: { type: string }
        executionStatus: { type: [string, 'null'], enum: [SUCCEEDED, FAILED, PARTIAL, null] }
        inputHash: { type: [string, 'null'] }
        outputHash: { type: [string, 'null'] }
        tool: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
        completionRequestId: { type: [string, 'null'] }
        terminatedAt: { type: [string, 'null'], format: date-time }
        terminationReason: { type: [string, 'null'] }
        terminationRequestId: { type: [string, 'null'] }
        version: { type: integer, minimum: 0 }
    IssueAttemptReceiptRequest:
      type: object
      additionalProperties: false
      required: [actionAttemptId]
      properties:
        actionAttemptId: { type: string, pattern: '^att_.+' }
    SupersedeReceiptRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    Receipt:
      type: object
      additionalProperties: false
      required: [id, version, keyId, algorithm, decisionId, mandateId, actionAttemptId, principalId, agentId, action, resource, executionStatus, inputHash, outputHash, tool, provider, model, approvalId, authorizedAt, executedAt, issuedAt, signature]
      properties:
        id: { type: string, pattern: '^rcpt_.+' }
        version: { type: string, enum: ['1.1', '1.2'] }
        keyId: { type: string }
        algorithm: { type: string, const: Ed25519 }
        decisionId: { type: string, pattern: '^dec_.+' }
        mandateId: { type: string, pattern: '^mnd_.+' }
        actionAttemptId: { type: string, pattern: '^att_.+' }
        principalId: { type: string }
        agentId: { type: string }
        action: { type: string }
        resource: { type: string }
        executionStatus: { type: string, enum: [SUCCEEDED, FAILED, PARTIAL] }
        inputHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        outputHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        tool: { type: string }
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        approvalId: { type: [string, 'null'] }
        authorizedAt: { type: [string, 'null'], format: date-time }
        executedAt: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time }
        supersedesReceiptId: { type: string, pattern: '^rcpt_.+' }
        supersessionReason: { type: string, minLength: 1, maxLength: 1000 }
        signature: { type: string }
      allOf:
        - if:
            properties:
              version: { const: '1.2' }
          then:
            required: [supersedesReceiptId, supersessionReason]
          else:
            not:
              anyOf:
                - required: [supersedesReceiptId]
                - required: [supersessionReason]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: [object, 'null'], additionalProperties: true }
            requestId: { type: string }
    MandateListResponse:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Mandate' } } }
    ApprovalListResponse:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Approval' } } }
    DecisionListResponse:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/AuthorizationDecision' } } }
    ActionAttemptListResponse:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/ActionAttempt' } } }
    ReceiptListResponse:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Receipt' } } }
    PageBase:
      type: object
      required: [data, hasMore, nextCursor]
      properties:
        data: { type: array, items: {} }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'] }
