<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Mandate-API architecture at a glance</title>
  <desc id="desc">A principal requests an action through an AI agent. Mandate-API allows the action, requires human approval, or denies it. Completed execution produces a signed action receipt.</desc>
  <defs>
    <linearGradient id="firewall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182536"/>
      <stop offset="1" stop-color="#0c1420"/>
    </linearGradient>
    <linearGradient id="receipt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { font-size: 22px; font-weight: 700; }
      .sub { font-size: 16px; fill: #334155; }
      .white { fill: #ffffff; }
      .muted-white { fill: #dbe5f1; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1400" height="600" rx="22" fill="#ffffff"/>

  <rect x="34" y="190" width="190" height="170" rx="18" fill="#f8fbff" stroke="#7aa2ff" stroke-width="2"/>
  <circle cx="129" cy="235" r="22" fill="#2563eb"/>
  <path d="M92 300 C92 270 166 270 166 300 V313 H92 Z" fill="#2563eb"/>
  <text x="129" y="329" text-anchor="middle" class="label" fill="#1d4ed8">Principal</text>
  <text x="129" y="352" text-anchor="middle" class="sub">User or service</text>

  <rect x="282" y="190" width="220" height="170" rx="18" fill="#fbf9ff" stroke="#9b87f5" stroke-width="2"/>
  <line x1="392" y1="217" x2="392" y2="229" stroke="#6d4bd6" stroke-width="4"/>
  <circle cx="392" cy="213" r="6" fill="#6d4bd6"/>
  <rect x="350" y="229" width="84" height="58" rx="14" fill="none" stroke="#6d4bd6" stroke-width="5"/>
  <circle cx="375" cy="255" r="7" fill="#6d4bd6"/>
  <circle cx="409" cy="255" r="7" fill="#6d4bd6"/>
  <path d="M373 274 H411" stroke="#6d4bd6" stroke-width="4" stroke-linecap="round"/>
  <path d="M350 247 H340 V271 H350 M434 247 H444 V271 H434" fill="none" stroke="#6d4bd6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="392" y="322" text-anchor="middle" class="label" fill="#5138b6">AI agent / automation</text>
  <text x="392" y="347" text-anchor="middle" class="sub">Requests an action</text>

  <rect x="556" y="52" width="418" height="410" rx="22" fill="url(#firewall)" filter="url(#shadow)"/>
  <path d="M599 77 L619 68 L639 77 V96 C639 110 630 121 619 127 C608 121 599 110 599 96 Z" fill="none" stroke="#d9e6f5" stroke-width="4"/>
  <path d="M607 101 V82 L619 94 L631 82 V101" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="657" y="103" font-size="27" font-weight="750" class="white">Mandate policy firewall</text>

  <rect x="583" y="139" width="364" height="78" rx="15" fill="#162332" stroke="#617184" stroke-width="1.5"/>
  <circle cx="626" cy="178" r="24" fill="#dcfce7"/>
  <path d="M613 178 L622 187 L641 166" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="668" y="173" font-size="24" font-weight="700" class="white">Allow</text>
  <text x="668" y="199" font-size="16" class="muted-white">Policy permits the action</text>

  <rect x="583" y="231" width="364" height="78" rx="15" fill="#162332" stroke="#617184" stroke-width="1.5"/>
  <circle cx="626" cy="270" r="24" fill="#ffedd5"/>
  <circle cx="626" cy="261" r="8" fill="#f59e0b"/>
  <path d="M610 287 C611 274 641 274 642 287" fill="#f59e0b"/>
  <text x="668" y="265" font-size="24" font-weight="700" class="white">Human approval</text>
  <text x="668" y="291" font-size="16" class="muted-white">Approval required by policy</text>

  <rect x="583" y="323" width="364" height="78" rx="15" fill="#162332" stroke="#617184" stroke-width="1.5"/>
  <circle cx="626" cy="362" r="24" fill="#fee2e2"/>
  <path d="M614 350 L638 374 M638 350 L614 374" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <text x="668" y="357" font-size="24" font-weight="700" class="white">Deny</text>
  <text x="668" y="383" font-size="16" class="muted-white">Policy blocks the action</text>

  <rect x="1050" y="92" width="316" height="122" rx="18" fill="#f5fff8" stroke="#4ade80" stroke-width="2"/>
  <circle cx="1105" cy="153" r="26" fill="none" stroke="#16a34a" stroke-width="4"/>
  <circle cx="1105" cy="153" r="8" fill="none" stroke="#16a34a" stroke-width="4"/>
  <path d="M1105 118 V128 M1105 178 V188 M1070 153 H1080 M1130 153 H1140 M1080 128 L1087 135 M1123 171 L1130 178 M1130 128 L1123 135 M1087 171 L1080 178" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <text x="1152" y="146" class="label" fill="#15803d">Execute action</text>
  <text x="1152" y="174" class="sub">Perform the approved</text>
  <text x="1152" y="197" class="sub">operation</text>

  <rect x="1050" y="248" width="316" height="122" rx="18" fill="#fffaf2" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="1105" cy="290" r="16" fill="none" stroke="#ea580c" stroke-width="4"/>
  <path d="M1078 344 C1080 315 1130 315 1132 344 Z" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round"/>
  <text x="1152" y="300" class="label" fill="#c2410c">Human approver</text>
  <text x="1152" y="328" class="sub">Reviews and approves</text>
  <text x="1152" y="351" class="sub">or rejects</text>

  <rect x="1050" y="406" width="316" height="82" rx="18" fill="#fff7f7" stroke="#f87171" stroke-width="2"/>
  <circle cx="1105" cy="447" r="21" fill="#fee2e2"/>
  <path d="M1094 436 L1116 458 M1116 436 L1094 458" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <text x="1152" y="454" class="label" fill="#dc2626">Blocked</text>

  <rect x="480" y="493" width="540" height="88" rx="18" fill="url(#receipt)" stroke="#7aa2ff" stroke-width="2"/>
  <path d="M526 516 L551 505 L576 516 V538 C576 557 564 571 551 579 C538 571 526 557 526 538 Z" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M539 541 L548 550 L565 530" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="533" font-size="25" font-weight="700" fill="#1d4ed8">Signed action receipt</text>
  <text x="600" y="561" class="sub">Cryptographically signed execution evidence</text>

  <path d="M224 275 H282" class="route" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M502 275 H556" class="route" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path d="M947 178 H1050" class="route" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path d="M947 270 H1050" class="route" stroke="#f59e0b" marker-end="url(#arrow-orange)"/>
  <path d="M947 362 H995 V447 H1050" class="route" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <path d="M1208 248 V214" class="route" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <text x="1220" y="236" font-size="13" fill="#15803d">approved</text>
  <path d="M1208 370 V406" class="route" stroke="#ef4444" marker-end="url(#arrow-red)"/>
  <text x="1219" y="395" font-size="13" fill="#dc2626">rejected</text>
  <path d="M1050 153 H1024 V493" class="route" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
</svg>
