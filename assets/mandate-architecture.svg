<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">Mandate-API architecture at a glance</title>
  <desc id="desc">A principal delegates an action to an AI agent. Mandate-API evaluates the request as allow, require human approval, or deny. Permitted executions produce a cryptographically signed action receipt.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#356ae6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#18a957"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <style>
      .label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#0f172a}
      .muted{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#475569}
      .white{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#f8fafc}
      .small{font-size:15px}
      .body{font-size:17px}
      .heading{font-size:20px;font-weight:700}
      .title{font-size:24px;font-weight:750}
    </style>
  </defs>

  <rect x="6" y="6" width="1388" height="528" rx="24" fill="#ffffff" stroke="#d8e2f0" stroke-width="2"/>

  <!-- Principal -->
  <g filter="url(#shadow)">
    <rect x="42" y="172" width="180" height="170" rx="18" fill="#f8fbff" stroke="#6aa0ff" stroke-width="2"/>
  </g>
  <text x="132" y="208" text-anchor="middle" class="label heading">Principal</text>
  <circle cx="132" cy="254" r="17" fill="#5b8def"/>
  <path d="M96 304c4-25 20-38 36-38s32 13 36 38" fill="#5b8def" opacity="0.95"/>
  <text x="132" y="326" text-anchor="middle" class="muted small">User or service</text>

  <!-- Agent -->
  <g filter="url(#shadow)">
    <rect x="278" y="172" width="222" height="170" rx="18" fill="#fbf9ff" stroke="#9c7df2" stroke-width="2"/>
  </g>
  <text x="389" y="208" text-anchor="middle" class="label heading">AI agent / automation</text>
  <rect x="354" y="237" width="70" height="54" rx="12" fill="none" stroke="#6d5bd0" stroke-width="4"/>
  <circle cx="374" cy="263" r="5" fill="#6d5bd0"/>
  <circle cx="404" cy="263" r="5" fill="#6d5bd0"/>
  <path d="M377 278h24" stroke="#6d5bd0" stroke-width="4" stroke-linecap="round"/>
  <path d="M389 224v13M343 253h11M424 253h11" stroke="#6d5bd0" stroke-width="4" stroke-linecap="round"/>
  <text x="389" y="326" text-anchor="middle" class="muted small">Proposes an action</text>

  <!-- Main flow arrows -->
  <path d="M222 257H270" fill="none" stroke="#356ae6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M500 257H548" fill="none" stroke="#356ae6" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Policy firewall -->
  <g filter="url(#shadow)">
    <rect x="558" y="54" width="350" height="354" rx="22" fill="#111b2b" stroke="#24364e" stroke-width="2"/>
  </g>

  <!-- Shield M -->
  <path d="M590 78l19-8 19 8v20c0 16-11 27-19 31-8-4-19-15-19-31z" fill="none" stroke="#dbeafe" stroke-width="3"/>
  <path d="M598 88v19m0-18 11 11 11-11v18" fill="none" stroke="#dbeafe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="101" class="white title">Mandate policy firewall</text>

  <!-- Allow -->
  <rect x="582" y="132" width="302" height="70" rx="13" fill="#172536" stroke="#60748e"/>
  <circle cx="620" cy="167" r="20" fill="#dcfce7"/>
  <path d="M610 167l7 7 14-16" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="653" y="160" class="white heading">Allow</text>
  <text x="653" y="183" class="white small" opacity="0.82">Policy permits the action</text>

  <!-- Approval -->
  <rect x="582" y="214" width="302" height="78" rx="13" fill="#172536" stroke="#60748e"/>
  <circle cx="620" cy="253" r="20" fill="#ffedd5"/>
  <circle cx="620" cy="247" r="6" fill="#f59e0b"/>
  <path d="M609 267c2-10 8-15 11-15s9 5 11 15" fill="#f59e0b"/>
  <text x="653" y="245" class="white heading">Require approval</text>
  <text x="653" y="269" class="white small" opacity="0.82">Pause for a human decision</text>

  <!-- Deny -->
  <rect x="582" y="304" width="302" height="70" rx="13" fill="#172536" stroke="#60748e"/>
  <circle cx="620" cy="339" r="20" fill="#fee2e2"/>
  <path d="M611 330l18 18m0-18-18 18" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <text x="653" y="332" class="white heading">Deny</text>
  <text x="653" y="355" class="white small" opacity="0.82">Policy blocks the action</text>

  <!-- Outcomes -->
  <g filter="url(#shadow)">
    <rect x="1010" y="72" width="252" height="102" rx="17" fill="#f3fbf5" stroke="#63c184" stroke-width="2"/>
  </g>
  <circle cx="1050" cy="123" r="22" fill="#dcfce7"/>
  <path d="M1038 123l8 8 17-19" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1084" y="112" class="label heading">Execute action</text>
  <text x="1084" y="137" class="muted small">Tool runs within the</text>
  <text x="1084" y="157" class="muted small">approved reservation</text>

  <g filter="url(#shadow)">
    <rect x="1010" y="215" width="252" height="110" rx="17" fill="#fffaf2" stroke="#f2b657" stroke-width="2"/>
  </g>
  <circle cx="1050" cy="270" r="22" fill="#ffedd5"/>
  <circle cx="1050" cy="263" r="7" fill="#f59e0b"/>
  <path d="M1037 288c2-12 9-18 13-18s11 6 13 18" fill="#f59e0b"/>
  <text x="1084" y="255" class="label heading">Human approver</text>
  <text x="1084" y="280" class="muted small">Approves or rejects the</text>
  <text x="1084" y="300" class="muted small">sensitive action</text>

  <g filter="url(#shadow)">
    <rect x="1010" y="364" width="252" height="78" rx="17" fill="#fff6f6" stroke="#ef8c8c" stroke-width="2"/>
  </g>
  <circle cx="1050" cy="403" r="19" fill="#fee2e2"/>
  <path d="M1042 395l16 16m0-16-16 16" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <text x="1084" y="398" class="label heading">Blocked</text>
  <text x="1084" y="421" class="muted small">No tool execution</text>

  <!-- Decision arrows -->
  <path d="M884 167H998" fill="none" stroke="#18a957" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M884 253H998" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <path d="M884 339H962V403H998" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M1136 215V188H1136V184" fill="none" stroke="#18a957" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M1262 270H1290V403H1274" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)"/>

  <!-- Receipt -->
  <path d="M1136 174V470H970" fill="none" stroke="#356ae6" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="400" y="446" width="570" height="70" rx="17" fill="#f7faff" stroke="#79a7ff" stroke-width="2"/>
  </g>
  <path d="M432 464l21-9 21 9v17c0 15-12 24-21 28-9-4-21-13-21-28z" fill="none" stroke="#4d80e8" stroke-width="3"/>
  <path d="M443 482l7 7 14-16" fill="none" stroke="#4d80e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="491" y="476" class="label heading">Signed action receipt</text>
  <text x="491" y="500" class="muted small">Immutable, cryptographically verifiable execution evidence</text>
</svg>
